# Release AAB for Google Play (signed when keystore secrets exist; otherwise debug-signed for size checks).

name: Android release AAB

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: false
        default: cursor/ionos-web-deploy-6e4c
  push:
    branches:
      - cursor/ionos-web-deploy-6e4c
    paths:
      - .github/trigger-android-release-aab

permissions:
  contents: read

jobs:
  bundle-release:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_USE_BUNDLED_WEB: '1'
      EXPO_PUBLIC_SHELL_VERSION: '0.1.0'
      EXPO_PUBLIC_PRODUCTION_GAME_URL: https://www.pantsonfire.app/
      EXPO_PUBLIC_ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_WEB_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKM="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found under ${ANDROID_HOME}"
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build slim bundled web
        env:
          VITE_APP_BUILD_SHA: ${{ github.sha }}
          VITE_APP_BUILD_STAMP: ${{ github.run_number }}-${{ github.sha }}
        run: node scripts/buildMobileBundledWeb.mjs dist-android

      - name: Verify dist-android asset references
        run: node scripts/verifyDistAndroidAssets.mjs dist-android

      - name: Smoke test mobile web bundle (Playwright)
        run: npx playwright install chromium --with-deps && npm run test:mobile-dist-smoke

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Patch WebView DLC asset loader
        run: node scripts/patch-rn-webview-asset-loader.mjs

      - name: Stage web bundle into Android assets
        run: node scripts/stageAndroidBundledWeb.mjs dist-android

      - name: Verify Play Billing Library (>= 8.0.0)
        run: bash scripts/verifyPlayBillingLibrary.sh

      - name: Require Play upload signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name (release AAB must use Play upload key, not debug)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Bundle release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PandroidVersionCode=${{ github.run_number }} \
            -PandroidVersionName=1.0.2

      - name: Collect AAB + size report
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/pants-on-fire-release.aab
          ls -lh artifacts/pants-on-fire-release.aab
          du -b artifacts/pants-on-fire-release.aab | tee artifacts/aab-size.txt
          if [ -f dist-android/mobile-trim-report.json ]; then
            cp dist-android/mobile-trim-report.json artifacts/mobile-trim-report.json
          fi

      - name: Verify embedded JS bundle in release AAB
        run: node scripts/verifyAndroidEmbeddedBundle.mjs artifacts/pants-on-fire-release.aab

      - name: Verify Play upload certificate on AAB
        env:
          EXPECTED_UPLOAD_CERT_SHA256: '4A:8F:52:75:8A:C5:26:6A:31:6E:3F:5B:41:64:76:A2:6E:3C:3A:B6:3F:47:84:C8:A8:CA:19:41:4A:6D:A3:C5'
        run: |
          set -euo pipefail
          normalize() { echo "$1" | tr '[:lower:]' '[:upper:]' | tr -d ':' | tr -d ' '; }
          ACTUAL=$(keytool -printcert -jarfile artifacts/pants-on-fire-release.aab 2>/dev/null | awk -F': ' '/SHA256:/ {print $2; exit}')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read signing certificate from release AAB (is it debug-signed or unsigned?)"
            exit 1
          fi
          if [ "$(normalize "$ACTUAL")" != "$(normalize "$EXPECTED_UPLOAD_CERT_SHA256")" ]; then
            echo "::error::Release AAB upload cert SHA-256 does not match the Play upload key"
            echo "Certificate SHA-256 from AAB: $ACTUAL"
            exit 1
          fi
          echo "Release AAB signed with Play upload key (SHA-256 verified)."

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: pants-on-fire-release-aab
          path: |
            artifacts/pants-on-fire-release.aab
            artifacts/aab-size.txt
            artifacts/mobile-trim-report.json
          if-no-files-found: error
          compression-level: 6
