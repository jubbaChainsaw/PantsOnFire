# Deploy production web UI (Vite dist/) to IONOS via SFTP.
# Runs on push to main or manual workflow_dispatch.

name: Deploy web to IONOS (SFTP)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and deploy (branch, tag, or SHA)
        required: false
        default: main
  push:
    branches:
      - main
      - cursor/ionos-web-deploy-6e4c
    paths:
      - .github/trigger-ionos-web-deploy

concurrency:
  group: deploy-ionos-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (www.pantsonfire.app)
        env:
          VITE_LOBBY_SERVER_URL: https://api.pantsonfire.app
          VITE_WEB_JOIN_ONLY: 'true'
          VITE_APP_BUILD_SHA: ${{ github.sha }}
          VITE_APP_BUILD_STAMP: ${{ github.run_number }}-${{ github.sha }}
          POF_WEB_VERSION: 0.1.${{ github.run_number }}
        run: npm run build

      - name: Stamp dist + offline manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          POF_WEB_VERSION: 0.1.${{ github.run_number }}
          VITE_APP_BUILD_SHA: ${{ github.sha }}
          VITE_APP_BUILD_STAMP: ${{ github.run_number }}-${{ github.sha }}
        run: |
          node scripts/writeWebBuildStamp.mjs dist
          node scripts/generateWebOfflineManifest.mjs dist

      - name: Verify dist and SPA .htaccess
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/build-stamp.json
          test -f dist/shell-version.json
          echo "dist size:" && du -sh dist
          echo "build-stamp.json:" && cat dist/build-stamp.json
          echo "shell-version.json (excerpt):" && head -c 500 dist/shell-version.json && echo

      - name: Install SFTP upload tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp openssh-client

      - name: Require IONOS SFTP secrets
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_REMOTE_DIR: ${{ secrets.IONOS_SFTP_REMOTE_DIR }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_KEY: ${{ secrets.IONOS_SFTP_KEY }}
        run: |
          missing=0
          for name in IONOS_SFTP_HOST IONOS_SFTP_USER IONOS_SFTP_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ -z "$IONOS_SFTP_PASSWORD" ] && [ -z "$IONOS_SFTP_KEY" ]; then
            echo "::error::Set IONOS_SFTP_PASSWORD or IONOS_SFTP_KEY"
            missing=1
          fi
          exit "$missing"

      - name: Resolve SFTP port
        id: sftp
        run: |
          PORT="${{ secrets.IONOS_SFTP_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Upload dist to IONOS (SFTP)
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
          SFTP_KEY: ${{ secrets.IONOS_SFTP_KEY }}
          SFTP_PORT: ${{ steps.sftp.outputs.port }}
          REMOTE_DIR: ${{ secrets.IONOS_SFTP_REMOTE_DIR }}
        run: bash scripts/ionosUploadDist.sh

      - name: Verify live www.pantsonfire.app build stamps
        env:
          EXPECT_SHA: ${{ github.sha }}
          EXPECT_VERSION: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          base="https://www.pantsonfire.app"
          for path in build-stamp.json shell-version.json; do
            echo "Fetching ${base}/${path}"
            curl -fsS "${base}/${path}" -o "/tmp/${path}"
            cat "/tmp/${path}"
          done
          node <<'NODE'
          const fs = require('fs');
          const expectSha = process.env.EXPECT_SHA;
          const expectVersion = process.env.EXPECT_VERSION;
          for (const file of ['build-stamp.json', 'shell-version.json']) {
            const doc = JSON.parse(fs.readFileSync(`/tmp/${file}`, 'utf8'));
            if (doc.webBuildSha !== expectSha) {
              console.error(`${file}: webBuildSha ${doc.webBuildSha} !== ${expectSha}`);
              process.exit(1);
            }
            if (doc.webVersion !== expectVersion) {
              console.error(`${file}: webVersion ${doc.webVersion} !== ${expectVersion}`);
              process.exit(1);
            }
          }
          console.log('Live build stamps match this deploy run.');
          NODE
