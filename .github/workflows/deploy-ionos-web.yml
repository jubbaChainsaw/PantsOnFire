# Deploy production web UI (Vite dist/) to IONOS via SFTP.
# Runs on push to main or manual workflow_dispatch.

name: Deploy web to IONOS (SFTP)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and deploy (branch, tag, or SHA)
        required: false
        default: main
  push:
    branches:
      - main
      - cursor/ionos-web-deploy-6e4c
    paths:
      - .github/trigger-ionos-web-deploy

concurrency:
  group: deploy-ionos-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (www.pantsonfire.app)
        env:
          VITE_LOBBY_SERVER_URL: https://api.pantsonfire.app
          VITE_WEB_JOIN_ONLY: 'true'
          VITE_APP_BUILD_SHA: ${{ github.sha }}
          VITE_APP_BUILD_STAMP: ${{ github.run_number }}-${{ github.sha }}
          POF_WEB_VERSION: 0.1.${{ github.run_number }}
        run: npm run build

      - name: Stamp dist + offline manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          POF_WEB_VERSION: 0.1.${{ github.run_number }}
          VITE_APP_BUILD_SHA: ${{ github.sha }}
          VITE_APP_BUILD_STAMP: ${{ github.run_number }}-${{ github.sha }}
        run: |
          node scripts/writeWebBuildStamp.mjs dist
          node scripts/generateWebOfflineManifest.mjs dist

      - name: Verify dist and SPA .htaccess
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          echo "dist size:" && du -sh dist

      - name: Require IONOS SFTP secrets
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_REMOTE_DIR: ${{ secrets.IONOS_SFTP_REMOTE_DIR }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_KEY: ${{ secrets.IONOS_SFTP_KEY }}
        run: |
          missing=0
          for name in IONOS_SFTP_HOST IONOS_SFTP_USER IONOS_SFTP_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ -z "$IONOS_SFTP_PASSWORD" ] && [ -z "$IONOS_SFTP_KEY" ]; then
            echo "::error::Set IONOS_SFTP_PASSWORD or IONOS_SFTP_KEY"
            missing=1
          fi
          exit "$missing"

      - name: Resolve SFTP port
        id: sftp
        run: |
          PORT="${{ secrets.IONOS_SFTP_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Upload dist to IONOS (SFTP)
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
          SFTP_KEY: ${{ secrets.IONOS_SFTP_KEY }}
          SFTP_PORT: ${{ steps.sftp.outputs.port }}
          REMOTE_DIR: ${{ secrets.IONOS_SFTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp openssh-client
          REMOTE="${REMOTE_DIR:-/}"
          REMOTE="${REMOTE%/}"
          if [ -z "$REMOTE" ]; then REMOTE="/"; fi
          PORT="${SFTP_PORT:-22}"
          WRAPPER="${RUNNER_TEMP}/sftp-ssh-wrap.sh"
          if [ -n "${SFTP_KEY:-}" ]; then
            mkdir -p ~/.ssh
            umask 077
            printf '%s\n' "$SFTP_KEY" > ~/.ssh/ionos_deploy_key
            chmod 600 ~/.ssh/ionos_deploy_key
            cat > "$WRAPPER" <<EOF
#!/bin/sh
exec ssh -a -x -o StrictHostKeyChecking=accept-new -p ${PORT} -i "\$HOME/.ssh/ionos_deploy_key" "\$@"
EOF
            LFTP_OPEN="open sftp://${SFTP_USER}@${SFTP_HOST}"
          elif [ -n "${SFTP_PASS:-}" ]; then
            sudo apt-get install -y sshpass
            export SSHPASS="$SFTP_PASS"
            cat > "$WRAPPER" <<EOF
#!/bin/sh
exec sshpass -e ssh -a -x -o StrictHostKeyChecking=accept-new -p ${PORT} -o PreferredAuthentications=password -o PubkeyAuthentication=no "\$@"
EOF
            LFTP_OPEN="open sftp://${SFTP_USER}@${SFTP_HOST}"
          else
            echo "::error::Missing IONOS_SFTP_PASSWORD or IONOS_SFTP_KEY"
            exit 1
          fi
          chmod +x "$WRAPPER"
          lftp -e "
            set cmd:fail-exit yes;
            set sftp:connect-program \"${WRAPPER}\";
            set net:max-retries 2;
            set net:timeout 120;
            ${LFTP_OPEN};
            lcd dist;
            cd \"${REMOTE}\";
            mirror --reverse --verbose --parallel=4;
            bye
          "
          echo "Upload complete (SFTP mirror to ${REMOTE})"
