# Bounded Playwright E2E on PRs and the active feature branch (Vite preview + in-memory lobby).
name: e2e playwright

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-playwright.yml'
  push:
    branches:
      - cursor/ionos-web-deploy-6e4c
    paths:
      - 'src/**'
      - 'server/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-playwright.yml'

concurrency:
  group: e2e-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E
        env:
          CI: '1'
        run: npm run test:e2e
