# Builds a debug APK with the Vite web client bundled under android_asset/pof-web.
# Trigger: Actions → Android debug APK → Run workflow (pick branch).

name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: false
        default: cursor/ionos-web-deploy-6e4c
  # Branch-only escape hatch when API workflow_dispatch is unavailable (touches this file only).
  push:
    branches:
      - cursor/ionos-web-deploy-6e4c
    paths:
      - .github/trigger-android-debug-apk

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKM="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found under ${ANDROID_HOME}"
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build bundled web (relative asset paths)
        run: npx vite build --base ./ --outDir dist-android

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Stage web bundle into Android assets
        run: node scripts/stageAndroidBundledWeb.mjs dist-android

      - name: Assemble debug APK
        working-directory: android
        env:
          EXPO_PUBLIC_GAME_URL: file:///android_asset/pof-web/index.html
          EXPO_PUBLIC_USE_BUNDLED_WEB: '1'
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK for artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/pants-on-fire-debug.apk
          ls -lh artifacts/pants-on-fire-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pants-on-fire-debug-apk
          path: artifacts/pants-on-fire-debug.apk
          if-no-files-found: error
          compression-level: 6
