# POF-ENH-005: run Node unit tests (server + billing) on PRs and branch pushes.
name: npm test

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm-test.yml'
  push:
    branches:
      - cursor/ionos-web-deploy-6e4c
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/npm-test.yml'

concurrency:
  group: npm-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm test
        run: npm test
